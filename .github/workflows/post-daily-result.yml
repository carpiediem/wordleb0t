name: Post Daily Result

on:
  schedule:
    - cron: '10 5 * * *' # ~00:10 America/New_York, shortly after NYT's daily rollover
  workflow_dispatch: {} # allows manual/backfill runs from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm

      - name: NPM install
        run: npm ci --legacy-peer-deps

      - name: Post today's result
        run: npm run post:daily-result
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
